[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # AgentCore runtime + observability
    "aws-opentelemetry-distro",
    "opentelemetry-instrumentation-langchain >= 0.59.0",
    "bedrock-agentcore >= 1.0.3",
    "botocore[crt] >= 1.35.0",
    # LangGraph + LangChain
    "langgraph >= 1.0.3",
    "langgraph-checkpoint-sqlite >= 3.0.3",
    "langgraph-checkpoint-aws >= 1.0.7",
    "langchain >= 1.0.8",
    "langchain-community >= 0.4.1",
    "langchain-aws >= 1.0.0",
    "langchain-openai >= 1.0.3",
    "langchain-pinecone >= 0.2.13",
    "langchain-mcp-adapters >= 0.1.11",
    # MCP servers used as stdio tools
    "mcp >= 1.22.0",
    "mcp-server-sqlite >= 2025.4.25",
    "yfmcp >= 0.11.1",
    # RAG + web search
    "pinecone >= 7.3.0",
    "tavily-python >= 0.7.13",
    "tiktoken >= 0.12.0",
    # Config + email
    "pydantic >= 2.12.4",
    "pydantic-settings >= 2.12.0",
    "python-dotenv >= 1.2.1",
    "emails >= 0.6",
    "aiosqlite >= 0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
