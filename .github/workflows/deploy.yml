name: Deploy AgentCore (prod)

# Pushes to master deploy. workflow_dispatch lets you redeploy on demand.
on:
  push:
    branches: [master]
    paths:
      - "market-intelligence-agent/**"
      - "prod/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write        # required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  MIA_ENV: demo
  CDK_VERSION: 2.170.0

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-intelligence-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen || uv sync
      - run: uv run pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prod/iac
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node (for cdk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g aws-cdk@${{ env.CDK_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Set up Docker Buildx (for arm64 image builds)
        uses: docker/setup-buildx-action@v3

      - name: CDK synth
        run: cdk synth --all
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          MIA_ALERT_EMAIL: ${{ secrets.MIA_ALERT_EMAIL }}

      - name: CDK deploy --all
        run: cdk deploy --all --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
          MIA_ALERT_EMAIL: ${{ secrets.MIA_ALERT_EMAIL }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: Smoke test the deployed Runtime
        run: python prod/ci/smoke.py
        env:
          MIA_ENV: ${{ env.MIA_ENV }}
          AWS_REGION: ${{ env.AWS_REGION }}
